<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkirUB - Pantau Slot Parkir Universitas Brawijaya</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-wrapper">

    <section class="left-panel">

      <div class="d-inline-flex align-items-center gap-2 user-select-none">
        <div style="width: 38px; height: 38px; background-color: #F2B601; color: #0F2A4A; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.35rem;">
          P
        </div>
        <span class="fs-5 fw-bold text-white" style="letter-spacing: -0.2px;">ParkirUB</span>
      </div>

      <div class="d-flex align-items-center justify-content-center justify-content-lg-start my-4 ps-lg-4">
        <div class="parking-grid">

          <div class="parking-box solid"></div>
          <div class="parking-box solid"></div>
          <div class="parking-box yellow">P</div>
          <div class="parking-box solid"></div>

          <div class="parking-box solid"></div>
          <div class="parking-box dashed" title="Slot Kosong (Tersedia)"></div>
          <div class="parking-box solid"></div>
          <div class="parking-box solid"></div>

          <div class="parking-box dashed" title="Slot Kosong (Tersedia)"></div>
          <div class="parking-box solid"></div>
          <div class="parking-box solid"></div>
          <div class="parking-box dashed" title="Slot Kosong (Tersedia)"></div>
        </div>
      </div>

      <div style="max-width: 480px;">
        <h1 class="fw-bold text-white mb-2" style="font-size: 2.2rem; line-height: 1.2; letter-spacing: -0.6px;">
          Tahu slot parkir sebelum<br class="d-none d-sm-inline"> sampai kampus.
        </h1>
        <p class="mb-0" style="color: #8FA1B4; font-size: 0.98rem; line-height: 1.55;">
          Pantau ketersediaan parkir di area Universitas Brawijaya dari kos atau saat di jalan.
        </p>
      </div>

    </section>

    <section class="right-panel">
      <div class="card border-0 shadow-sm p-4" style="border-radius: 20px; max-width: 400px; width: 100%;">
        <h2 class="fw-bold text-dark mb-1" style="font-size: 1.55rem; letter-spacing: -0.3px;">Masuk</h2>
        <p class="text-secondary small mb-3" style="line-height: 1.5;">
          Gunakan akun SSO Universitas Brawijaya untuk melihat ketersediaan parkir.
        </p>

        <form id="ssoLoginForm">
          <div class="mb-3">
            <label for="ssoUsername" class="form-label small fw-semibold text-secondary mb-1">NIM / Email Mahasiswa</label>
            <input type="text" class="form-control rounded-3" id="ssoUsername" placeholder="Contoh: 21515020... / nama@student.ub.ac.id" required>
          </div>

          <div class="mb-3">
            <label for="ssoPassword" class="form-label small fw-semibold text-secondary mb-1">Kata Sandi</label>
            <div class="input-group">
              <input type="password" class="form-control rounded-start-3" id="ssoPassword" placeholder="Masukkan kata sandi SSO" required>
              <button class="btn btn-outline-secondary border-start-0" type="button" id="btnTogglePassword" style="border-color: #dee2e6; border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem;" title="Lihat kata sandi">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small text-secondary" for="rememberMe">Ingat sesi saya</label>
            </div>
            <a href="#" class="small text-decoration-none text-primary" onclick="alert('Untuk kendala akun SSO, silakan hubungi Helpdesk TIK UB (helpdesk@ub.ac.id).'); return false;">Lupa sandi?</a>
          </div>

          <button type="submit" class="btn-sso w-100" id="btnSubmitLogin">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Masuk dengan SSO UB</span>
          </button>

          <div id="loginAlert" class="alert d-none mt-3 mb-0" role="alert"></div>
        </form>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/login.js"></script>
</body>
</html>
